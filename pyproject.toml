[project]
name = "x-forwarded-for-chain"
version = "0.1.0"
description = "Parse the X-Forwarded-For header chain, identify direct and proxy-originated addresses, and apply trusted-proxy filtering."
requires-python = ">=3.10"
dependencies = []
readme = "README.md"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
